# Workflow репозитория DaCat-stack/axon-repo (лежит там в .github/workflows/publish.yml; исходник — здесь).
# Публикует пакеты AXON из main репозитория axon-linux своим встроенным токеном — без SSH-ключей.
# Каждые 15 минут: если в axon-linux/main новый коммит — собрать, подписать, положить в axon-testing,
# проверить «как у пользователя», перенести прошедшие в axon. Ночью — «пульс» (свежая дата на сайте).
name: Публикация пакетов AXON

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: axon-repo
  cancel-in-progress: false

env:
  BASE: https://dacat-stack.github.io/axon-repo
  PKGS: axon-keyring axon-branding axon-welcome axon-desktop

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Исходники AXON (main)
        uses: actions/checkout@v4
        with:
          repository: DaCat-stack/axon-linux
          ref: main
          fetch-depth: 0   # версия пакетов считается по истории git
          path: src

      - name: Сайт репозитория (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Нужна ли публикация
        id: need
        run: |
          head=$(git -C src rev-parse HEAD)
          last=$(cat site/built-sha.txt 2>/dev/null || true)
          heartbeat=no; [ "$(date -u +%H)" = 03 ] && [ "$(date -u +%M)" -lt 15 ] && heartbeat=yes
          if [ "$head" != "$last" ] || [ "$heartbeat" = yes ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "Нечего публиковать: $head уже опубликован"
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Собрать, подписать, положить в axon-testing
        if: steps.need.outputs.run == 'yes'
        env:
          AXON_SIGN_SUBKEY: ${{ secrets.AXON_SIGN_SUBKEY }}
          AXON_SIGN_PASS: ${{ secrets.AXON_SIGN_PASS }}
        run: docker run --rm -e AXON_SIGN_SUBKEY -e AXON_SIGN_PASS -v "$PWD:/w" archlinux:latest bash /w/src/ci/publish-build.sh /w/site

      - name: Опубликовать axon-testing
        if: steps.need.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: src/ci/publish-deploy.sh site "testing ${{ steps.need.outputs.head }}"

      - name: Проверка axon-testing как у пользователя
        if: steps.need.outputs.run == 'yes'
        run: src/ci/e2e-repo.sh "$BASE" axon-testing "$PWD/e2e-testing.txt" $PKGS || true

      - name: Перенести прошедшие в axon
        if: steps.need.outputs.run == 'yes'
        env:
          AXON_SIGN_SUBKEY: ${{ secrets.AXON_SIGN_SUBKEY }}
          AXON_SIGN_PASS: ${{ secrets.AXON_SIGN_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cat e2e-testing.txt
          docker run --rm -e AXON_SIGN_SUBKEY -e AXON_SIGN_PASS -v "$PWD:/w" archlinux:latest \
            bash /w/src/ci/publish-promote.sh /w/site /w/e2e-testing.txt
          echo "${{ steps.need.outputs.head }}" > site/built-sha.txt
          src/ci/publish-deploy.sh site "stable ${{ steps.need.outputs.head }}"

      - name: Проверка axon как у пользователя
        if: steps.need.outputs.run == 'yes'
        run: src/ci/e2e-repo.sh "$BASE" axon "$PWD/e2e-stable.txt" $PKGS

      - name: Все пакеты прошли проверку в axon-testing
        if: steps.need.outputs.run == 'yes'
        run: |
          for p in $PKGS; do grep -q "^$p " e2e-testing.txt || { echo "::error::$p не прошёл проверку в axon-testing"; exit 1; }; done
